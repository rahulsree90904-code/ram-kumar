<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>All ADDA — Chat & Calls</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#eef1f3}
body{overflow:hidden}
.app{height:100%;max-width:520px;margin:auto;background:#fff;display:flex;flex-direction:column}

.header{
height:62px;flex-shrink:0;background:#075e54;color:#fff;
padding:0 16px;display:flex;align-items:center;justify-content:space-between
}
.header b{font-size:23px}
.header small{font-size:12px;opacity:.9}

.screen{flex:1;min-height:0;overflow:auto;padding:18px}
.hidden{display:none!important}

input{
width:100%;padding:13px;margin:6px 0;border:1px solid #ccc;
border-radius:10px;font-size:16px
}

button{
border:0;border-radius:10px;padding:11px 15px;
background:#075e54;color:#fff;font-size:15px;cursor:pointer
}

.primary{width:100%;margin-top:8px}
.muted{background:#777}
.danger{background:#b3261e}
.callbtn{background:#128c7e}

.note{
background:#fff8e1;padding:11px;border-radius:10px;
font-size:13px;margin:10px 0
}

.error{color:#b3261e;min-height:20px;font-size:13px}

.userrow{
display:flex;align-items:center;gap:12px;padding:13px 4px;
border-bottom:1px solid #eee;cursor:pointer
}

.avatar{
width:46px;height:46px;border-radius:50%;
background:#128c7e;color:white;display:grid;
place-items:center;font-weight:bold;font-size:18px
}

.info{flex:1}
.name{font-weight:bold}
.handle
