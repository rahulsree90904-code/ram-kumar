<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>All ADDA – Chat • Audio • Video</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef1f3;
    }

    .app {
      max-width: 520px;
      margin: auto;
      min-height: 100vh;
      background: white;
    }

    .header {
      height: 62px;
      background: #075e54;
      color: white;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header b {
      font-size: 23px;
    }

    .screen {
      padding: 18px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 6px 0;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 12px 15px;
      background: #075e54;
      color: white;
      font-size: 16px;
      cursor: pointer;
      margin-top: 8px;
    }

    .secondary {
      background: #777;
    }

    .user {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 4px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }

    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: #128c7e;
      color: white;
      display: grid;
      place-items: center;
      font-weight: bold;
      font-size: 18px;
    }

    .info {
      flex: 1;
    }

    .name {
      font-weight: bold;
      font-size: 17px;
    }

    .handle {
      color: #777;
      margin-top: 4px;
    }

    .error {
      color: #b3261e;
      min-height: 20px;
      font-size: 13px;
      margin-top: 8px;
    }

    .chat-box {
      height: 55vh;
      overflow-y: auto;
      padding: 10px;
      background: #f4f4f4;
      border-radius: 10px;
    }

    .message {
      max-width: 78%;
      padding: 9px 12px;
      margin: 7px 0;
      border-radius: 12px;
      word-wrap: break-word;
    }

    .mine {
      margin-left: auto;
      background: #dcf8c6;
    }

    .theirs {
      margin-right: auto;
      background: white;
    }

    .chat-input {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .chat-input input {
      margin: 0;
      flex: 1;
    }

    .chat-input button {
      width: 90px;
      margin: 0;
    }

    .hidden {
      display: none !important;
    }

    .title {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 18px;
    }

    .note {
      background: #fff8e1;
      padding: 11px;
      border-radius: 10px;
      font-size: 13px;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    <b>All ADDA</b>
    <span>Chat • Audio • Video</span>
  </div>

  <!-- PROFILE -->
  <div id="profileScreen" class="screen">

    <div class="title">আপনার প্রোফাইল</div>

    <p>একটি নাম ও ইউনিক Username দিন।</p>

    <input id="nameInput" placeholder="আপনার নাম">

    <input id="usernameInput" placeholder="Username">

    <div id="profileError" class="error"></div>

    <button onclick="saveProfile()">Continue</button>

    <div class="note">
      Username অন্যদের থেকে আলাদা হতে হবে।
    </div>

  </div>


  <!-- HOME -->
  <div id="homeScreen" class="screen hidden">

    <div class="title">All ADDA</div>

    <div id="myProfile"></div>

    <button onclick="loadUsers()">Users Refresh</button>

    <div id="usersList"></div>

    <button class="secondary" onclick="logout()">Logout</button>

  </div>


  <!-- CHAT -->
  <div id="chatScreen" class="screen hidden">

    <button onclick="backHome()">← Back</button>

    <div id="chatTitle" class="title"></div>

    <div id="chatBox" class="chat-box"></div>

    <div class="chat-input">
      <input id="messageInput" placeholder="মেসেজ লিখুন...">
      <button onclick="sendMessage()">Send</button>
    </div>

    <div id="chatError" class="error"></div>

  </div>

</div>


<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

  import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    doc,
    setDoc,
    query,
    orderBy,
    onSnapshot,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


  /* FIREBASE */

  const firebaseConfig = {
    apiKey: "AIzaSyAk4ypWTZ_2DEkJC8_T9JvJgqvCEoX38Rk",
    authDomain: "all-adda-bfe4e.firebaseapp.com",
    projectId: "all-adda-bfe4e",
    storageBucket: "all-adda-bfe4e.firebasestorage.app",
    messagingSenderId: "236442476565",
    appId: "1:236442476565:web:cd357d47cbdeb0163fae1c"
  };

  const app = initializeApp(firebaseConfig);

  const db = getFirestore(app);


  /* CURRENT USER */

  let currentUser = JSON.parse(
    localStorage.getItem("allAddaUser") || "null"
  );

  let selectedUser = null;

  let stopMessages = null;


  /* START APP */

  if (currentUser) {
    showHome();
    loadUsers();
  } else {
    showProfile();
  }


  /* PROFILE */

  window.saveProfile = async function () {

    const name =
      document.getElementById("nameInput").value.trim();

    const username =
      document.getElementById("usernameInput").value.trim();


    if (!name || !username) {
      document.getElementById("profileError").innerText =
        "নাম ও Username দুটোই দিন।";
      return;
    }


    try {

      const usersRef = collection(db, "users");

      const snapshot = await getDocs(usersRef);

      let exists = false;

      snapshot.forEach((item) => {

        const data = item.data();

        if (
          data.username &&
          data.username.toLowerCase() === username.toLowerCase()
        ) {
          exists = true;
        }

      });


      if (exists) {

        document.getElementById("profileError").innerText =
          "এই Username ইতিমধ্যে ব্যবহার করা হয়েছে।";

        return;
      }


      const userRef = doc(usersRef);

      await setDoc(userRef, {

        name: name,

        username: username,

        createdAt: serverTimestamp()

      });


      currentUser = {

        id: userRef.id,

        name: name,

        username: username

      };


      localStorage.setItem(
        "allAddaUser",
        JSON.stringify(currentUser)
      );


      showHome();

      loadUsers();


    } catch (error) {

      console.error(error);

      document.getElementById("profileError").innerText =
        "Profile save করা যায়নি: " + error.message;

    }

  };


  /* USERS */

  window.loadUsers = async function () {

    const list =
      document.getElementById("usersList");

    list.innerHTML = "Loading users...";


    try {

      const snapshot =
        await getDocs(collection(db, "users"));


      list.innerHTML = "";


      snapshot.forEach((item) => {

        const user = {

          id: item.id,

          ...item.data()

        };


        if (user.id === currentUser.id) {
          return;
        }


        const div =
          document.createElement("div");

        div.className = "user";


        div.innerHTML = `

          <div class="avatar">
            ${(user.name || "U").charAt(0).toUpperCase()}
          </div>

          <div class="info">

            <div class="name">
              ${escapeHtml(user.name || "Unknown")}
            </div>

            <div class="handle">
              @${escapeHtml(user.username || "")}
            </div>

          </div>

        `;


        div.onclick = () => openChat(user);


        list.appendChild(div);

      });


      if (!list.innerHTML) {

        list.innerHTML =
          "<p>অন্য কোনো User এখনো নেই।</p>";

      }


    } catch (error) {

      console.error(error);

      list.innerHTML =
        "<div class='error'>Users load করা যায়নি।</div>";

    }

  };


  /* OPEN CHAT */

  window.openChat = function (user) {

    selectedUser = user;

    document.getElementById("homeScreen")
      .classList.add("hidden");

    document.getElementById("chatScreen")
      .classList.remove("hidden");


    document.getElementById("chatTitle").innerText =
      user.name + "  @" + user.username;


    document.getElementById("chatBox").innerHTML =
      "Loading messages...";


    listenMessages();

  };


  /* REAL-TIME MESSAGES */

  function listenMessages() {

    if (stopMessages) {
      stopMessages();
    }


    const messagesRef =
      collection(db, "messages");


    const q =
      query(messagesRef, orderBy("createdAt"));


    stopMessages = onSnapshot(q, (snapshot) => {

      const box =
        document.getElementById("chatBox");

      box.innerHTML = "";


      snapshot.forEach((item) => {

        const msg = item.data();


        const isMine =
          msg.senderId === currentUser.id &&
          msg.receiverId === selectedUser.id;


        const isTheirs =
          msg.senderId === selectedUser.id &&
          msg.receiverId === currentUser.id;


        if (!isMine && !isTheirs) {
          return;
        }


        const div =
          document.createElement("div");


        div.className =
          "message " +
          (isMine ? "mine" : "theirs");


        div.innerText =
          msg.text || "";


        box.appendChild(div);

      });


      box.scrollTop = box.scrollHeight;

    });

  }


  /* SEND MESSAGE */

  window.sendMessage = async function () {

    const input =
      document.getElementById("messageInput");

    const text =
      input.value.trim();


    if (!text || !selectedUser) {
      return;
    }


    try {

      await addDoc(
        collection(db, "messages"),
        {

          senderId: currentUser.id,

          senderName: currentUser.name,

          receiverId: selectedUser.id,

          receiverName: selectedUser.name,

          text: text,

          createdAt: serverTimestamp()

        }
      );


      input.value = "";


    } catch (error) {

      console.error(error);

      document.getElementById("chatError").innerText =
        "Message পাঠানো যায়নি: " + error.message;

    }

  };


  /* BACK */

  window.backHome = function () {

    if (stopMessages) {
      stopMessages();
      stopMessages = null;
    }

    selectedUser = null;

    document.getElementById("chatScreen")
      .classList.add("hidden");

    document.getElementById("homeScreen")
      .classList.remove("hidden");

    loadUsers();

  };


  /* HOME */

  function showHome() {

    document.getElementById("profileScreen")
      .classList.add("hidden");

    document.getElementById("chatScreen")
      .classList.add("hidden");

    document.getElementById("homeScreen")
      .classList.remove("hidden");


    document.getElementById("myProfile").innerHTML = `

      <div class="user">

        <div class="avatar">
          ${(currentUser.name || "U").charAt(0).toUpperCase()}
        </div>

        <div class="info">

          <div class="name">
            ${escapeHtml(currentUser.name)}
          </div>

          <div class="handle">
            @${escapeHtml(currentUser.username)}
          </div>

        </div>

      </div>

    `;

  }


  /* PROFILE */

  function showProfile() {

    document.getElementById("profileScreen")
      .classList.remove("hidden");

    document.getElementById("homeScreen")
      .classList.add("hidden");

    document.getElementById("chatScreen")
      .classList.add("hidden");

  }


  /* LOGOUT */

  window.logout = function () {

    localStorage.removeItem("allAddaUser");

    currentUser = null;

    if (stopMessages) {
      stopMessages();
    }

    showProfile();

  };


  /* HTML SAFETY */

  function escapeHtml(text) {

    return String(text)

      .replaceAll("&", "&amp;")

      .replaceAll("<", "&lt;")

      .replaceAll(">", "&gt;")

      .replaceAll('"', "&quot;")

      .replaceAll("'", "&#039;");

  }

</script>

</body>
</html>
